<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/fonts/PPMonumentExtended-Heavy.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>MOAR Bar — Focus. For Hours.</title>
    <meta name="description" content="The clean caffeinated protein bar. Real energy that lasts, with natural caffeine from guarana, protein, and zero added sugar." />
    <!-- SPA redirect handler for GitHub Pages 404.html -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
